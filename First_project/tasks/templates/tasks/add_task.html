{% extends "tasks/layout.html" %}


{% block body %}
    <h1>Add a task</h1>
    <form action="{% url 'tasks:add_task' %}" method="post">
        {% csrf_token %}
        <input type="text" name="add_task">
        <input type="submit">
    </form>
    <a href="{% url 'tasks:index' %}">Go to tasks!</a>
{% endblock %}
